[package]
name = "polybacktest-rs"
version = "0.1.0"
edition = "2021"

[lib]
name = "polybacktest_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"] }
numpy = "0.23"
ndarray = "0.16"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
flate2 = "1.0"
csv = "1.3"
thiserror = "2.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
